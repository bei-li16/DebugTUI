    { "name" = "RES0_30_24", "segments" = [{ "offset" = 24, "width" = 7 }], "description" = "保留为零；不能因RES0一词自行推定任意写入均被忽略。 原权限/规则=RES0。 文档字段复位/参数=0；仅在适用r1p4配置和GIC复位域有效。", "access" = "ro" },
