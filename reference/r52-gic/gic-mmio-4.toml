description = "GICD_IROUTER893；index < 32*(ITLinesNumber+1)。 [MMIO] 基址由CBAR/PERIPHBASE配置采样决定，Device nGnRnE；寄存器未列GIC内部trap/enable，不等同无处理器特权/MMU/SoC访问限制。本清单只描述产品/架构允许的操作，不证明工具支持；本审计无硬件操作。 [ACCESS_WIDTH] 32位字及64位GICD/GICR双字应支持对应single-copy atomic访问；仅明确列出的priority等寄存器允许byte访问。本产品的已列byte入口为IPRIORITYR。若系统含不能64位访问的直接访问组件，架构要求允许64位寄存器高/低32位分别single-copy atomic访问，专门64-bit-only寄存器除外；不能把两次32位访问声明为一次64位原子读取。字节/半字/双字可访问寄存器使用little-endian。非列举byte/双字、非对齐字/双字、quadword及exclusive不支持，可导致UNKNOWN/UNPREDICTABLE或abort。 [BUS_ORDER] 访问跨不同寄存器时须由Device属性和适合屏障建立所需顺序；本产品要求Device-nGnRnE。软件须保证写入完成，例如平台支持相应属性时Device-nGnRnE加DSB，或适合其读写语义的回读；命令/W1C寄存器不能套写值等值回读。总线访问完成不等于GIC内部清使能传播完成，后者还需限定RWP。MMIO RO写忽略，MMIO WO读UNKNOWN；不能套入系统寄存器RO写UNDEFINED规则。 [RESET_SCOPE] 产品复位覆盖架构UNKNOWN仅限明确产品表的字段；不可把GICR_TYPER两核例子、GICD_TYPER最大值或IROUTER零值强制到未知配置。只说明GIC复位，不推断板级reset域映射。 [PRESENCE] GICD表为最大容量；按ITLinesNumber逐实例选择。多数未实现数组RAZ/WI，ICPENDR的TRM原文RES0保留，不直接推定任意写忽略。 [ROUTING] IROUTER每SPI一个64位视图，Aff1/2为产品配置RO，Aff0合法目标0..NUM_TARGET-1含导出。无效affinity目标的pending中断属CONSTRAINED UNPREDICTABLE，不能依赖未声明实现选择。pending期间改路由旧/新路由之一须有限时间生效且不丢失/重复处理。产品IRM为RAZ/WI优先于架构一般No1N非法写行为。 通用地址/owner配置规则见本寄存器分组description。 本目录是条件访问模板，1485个Distributor槽位和33个当前核Redistributor模板不代表本机全部实现。gicd.itlinesnumber必须据目标配置填写1..30，核心数1..4；条件未知不强制最大值。未实现SPI实例保留原手册规则：多数RAZ/WI，ICPENDR的RES0不推导任意写忽略。 此模板只适用于物理核Redistributor，不把可选导出端口当额外处理器或补出PPI。导出为最后target且无PPI，转发须相应SPI/组使能及ProcessorSleep=0；导出其他217个字段的适用性尚未证明，保持独立限制记录。 硬件权限与现有MMIO读取工具能力分别限定；没有writer或write计划。64bit视图不拆成两个独立寄存器，也不宣称后端两次32bit事务具有64bit原子性。 Aff0仅实际低ceil(log2(NUM_TARGET))位可配置，N=1时无可写低位，其余位保持0；合法目标0..N-1，N=cores+可选export，最多5，不把整个8bit均当合法写值。Aff1/2为配置RO，Aff3不用且非零写行为证据不足。"
