    { "name" = "Aff0", "segments" = [{ "offset" = 0, "width" = 8 }], "description" = "选择目标号0..NUM_TARGET-1；低ceil(log2(NUM_TARGET))位实现，其余位为0；只有一目标时全零。 原权限/规则=rw_configuration_dependent。 文档字段复位/参数=None；仅在适用r1p4配置和GIC复位域有效。 保留资料限定编号SRC-173。", "access" = "rw" },
]
