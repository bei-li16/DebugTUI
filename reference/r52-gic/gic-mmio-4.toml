version = 2
cpu = "cortex-r52"
architecture = "armv8-r-aarch32"
[[groups]]
id = "gic_distributor"
name = "GIC Distributor MMIO"
description = "Cluster owner、实际容量和PERIPHBASE限定的SPI配置接口。  地址关系：GICD base=实际PERIPHBASE；GICR_control base=PERIPHBASE+0x100000+target*0x20000，SGI/PPI页为该base+0x10000。PERIPHBASE由实际CFG采样/CBAR确定，不猜板级绝对地址。 配置registers.topology.clusters把当前core映射到真实cluster，并分别配置component_owners.gicd[cluster:ID]或component_owners.gicr[core:ID]实际base/channel/little_endian。owner mapping不可缺省或借用别核。gicr每核使用同一逻辑模板，各owner base必须对应其真实target。 显示元数据不能把保留、RAZ/WI、RAO/WI或未用位视为可普通配置；每个字段原权限/规则及复位参数仍逐项保留。"

[[groups]]
id = "gic_redistributor"
name = "GIC Redistributor MMIO"
description = "当前物理核owner的控制、SGI/PPI和身份接口；可选导出身份另按cluster映射。  地址关系：GICD base=实际PERIPHBASE；GICR_control base=PERIPHBASE+0x100000+target*0x20000，SGI/PPI页为该base+0x10000。PERIPHBASE由实际CFG采样/CBAR确定，不猜板级绝对地址。 配置registers.topology.clusters把当前core映射到真实cluster，并分别配置component_owners.gicd[cluster:ID]或component_owners.gicr[core:ID]实际base/channel/little_endian。owner mapping不可缺省或借用别核。gicr每核使用同一逻辑模板，各owner base必须对应其真实target。 显示元数据不能把保留、RAZ/WI、RAO/WI或未用位视为可普通配置；每个字段原权限/规则及复位参数仍逐项保留。"

[[registers]]
id = "gicd.irouter863"
name = "GICD_IROUTER863"
group = "gic_distributor"
bits = 64
access = "rw"
scope = "cluster"
reader = { "kind" = "mmio", "component" = "gicd", "offset" = 31480, "require_owner_mapping" = true }
fields = [
    { "name" = "RES0_63_40", "segments" = [{ "offset" = 40, "width" = 24 }], "description" = "保留为零；不能因RES0一词自行推定任意写入均被忽略。 原权限/规则=RES0。 文档字段复位/参数=0；仅在适用r1p4配置和GIC复位域有效。", "access" = "ro" },
    { "name" = "Aff3", "segments" = [{ "offset" = 32, "width" = 8 }], "description" = "不使用，读值和复位为0；TRM未明确单独说明对非零写入的行为，不擅自标WI。 原权限/规则=unused_zero。 文档字段复位/参数=0；仅在适用r1p4配置和GIC复位域有效。", "access" = "ro" },
    { "name" = "IRM", "segments" = [{ "offset" = 31, "width" = 1 }], "description" = "不支持1-of-N路由，使用指定目标。 原权限/规则=RAZ/WI。 文档字段复位/参数=0；仅在适用r1p4配置和GIC复位域有效。", "access" = "ro" },
    { "name" = "RES0_30_24", "segments" = [{ "offset" = 24, "width" = 7 }], "description" = "保留为零；不能因RES0一词自行推定任意写入均被忽略。 原权限/规则=RES0。 文档字段复位/参数=0；仅在适用r1p4配置和GIC复位域有效。", "access" = "ro" },
    { "name" = "Aff2", "segments" = [{ "offset" = 16, "width" = 8 }], "description" = "读取CFGMPIDRAFF2[7:0]。 原权限/规则=ro。 文档字段复位/参数=CFGMPIDRAFF2；仅在适用r1p4配置和GIC复位域有效。 保留资料限定编号SRC-173。", "access" = "ro" },
    { "name" = "Aff1", "segments" = [{ "offset" = 8, "width" = 8 }], "description" = "读取CFGMPIDRAFF1[7:0]。 原权限/规则=ro。 文档字段复位/参数=CFGMPIDRAFF1；仅在适用r1p4配置和GIC复位域有效。 保留资料限定编号SRC-173。", "access" = "ro" },
    { "name" = "Aff0", "segments" = [{ "offset" = 0, "width" = 8 }], "description" = "选择目标号0..NUM_TARGET-1；低ceil(log2(NUM_TARGET))位实现，其余位为0；只有一目标时全零。 原权限/规则=rw_configuration_dependent。 文档字段复位/参数=None；仅在适用r1p4配置和GIC复位域有效。 保留资料限定编号SRC-173。", "access" = "rw" },
]
source = { "document" = "Cortex-R52 TRM 100026_0104_01_en", "version" = "r1p4 Issue01, 2024-04-05", "number" = "100026_0104_01_en", "section" = "10.3.1.13 Tables10-29/30", "page" = 300 }
confidence = "high"
description = "GICD_IROUTER863；index < 32*(ITLinesNumber+1)。 [MMIO] 基址由CBAR/PERIPHBASE配置采样决定，Device nGnRnE；寄存器未列GIC内部trap/enable，不等同无处理器特权/MMU/SoC访问限制。本清单只描述产品/架构允许的操作，不证明工具支持；本审计无硬件操作。 [ACCESS_WIDTH] 32位字及64位GICD/GICR双字应支持对应single-copy atomic访问；仅明确列出的priority等寄存器允许byte访问。本产品的已列byte入口为IPRIORITYR。若系统含不能64位访问的直接访问组件，架构要求允许64位寄存器高/低32位分别single-copy atomic访问，专门64-bit-only寄存器除外；不能把两次32位访问声明为一次64位原子读取。字节/半字/双字可访问寄存器使用little-endian。非列举byte/双字、非对齐字/双字、quadword及exclusive不支持，可导致UNKNOWN/UNPREDICTABLE或abort。 [BUS_ORDER] 访问跨不同寄存器时须由Device属性和适合屏障建立所需顺序；本产品要求Device-nGnRnE。软件须保证写入完成，例如平台支持相应属性时Device-nGnRnE加DSB，或适合其读写语义的回读；命令/W1C寄存器不能套写值等值回读。总线访问完成不等于GIC内部清使能传播完成，后者还需限定RWP。MMIO RO写忽略，MMIO WO读UNKNOWN；不能套入系统寄存器RO写UNDEFINED规则。 [RESET_SCOPE] 产品复位覆盖架构UNKNOWN仅限明确产品表的字段；不可把GICR_TYPER两核例子、GICD_TYPER最大值或IROUTER零值强制到未知配置。只说明GIC复位，不推断板级reset域映射。 [PRESENCE] GICD表为最大容量；按ITLinesNumber逐实例选择。多数未实现数组RAZ/WI，ICPENDR的TRM原文RES0保留，不直接推定任意写忽略。 [ROUTING] IROUTER每SPI一个64位视图，Aff1/2为产品配置RO，Aff0合法目标0..NUM_TARGET-1含导出。无效affinity目标的pending中断属CONSTRAINED UNPREDICTABLE，不能依赖未声明实现选择。pending期间改路由旧/新路由之一须有限时间生效且不丢失/重复处理。产品IRM为RAZ/WI优先于架构一般No1N非法写行为。 通用地址/owner配置规则见本寄存器分组description。 本目录是条件访问模板，1485个Distributor槽位和33个当前核Redistributor模板不代表本机全部实现。gicd.itlinesnumber必须据目标配置填写1..30，核心数1..4；条件未知不强制最大值。未实现SPI实例保留原手册规则：多数RAZ/WI，ICPENDR的RES0不推导任意写忽略。 此模板只适用于物理核Redistributor，不把可选导出端口当额外处理器或补出PPI。导出为最后target且无PPI，转发须相应SPI/组使能及ProcessorSleep=0；导出其他217个字段的适用性尚未证明，保持独立限制记录。 硬件权限与现有MMIO读取工具能力分别限定；没有writer或write计划。64bit视图不拆成两个独立寄存器，也不宣称后端两次32bit事务具有64bit原子性。 Aff0仅实际低ceil(log2(NUM_TARGET))位可配置，N=1时无可写低位，其余位保持0；合法目标0..N-1，N=cores+可选export，最多5，不把整个8bit均当合法写值。Aff1/2为配置RO，Aff3不用且非零写行为证据不足。"
access_condition = "特权/EL、处理器MPU和SoC总线权限、Device nGnRnE属性、目标owner映射、容量配置及GIC专用同步前提各自满足；不能把无GIC内部trap等同任何软件均可访问。"
read_side_effect = false
fields_missing = false
conditions = [{ "fact" = "gicd.present", "min" = 1, "max" = 1 }, { "fact" = "gicd.itlinesnumber", "min" = 26, "max" = 30 }]

