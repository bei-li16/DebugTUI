# STM32F429 with an ST-Link (V2J24 or later, or V3), SWD and direct AHB access.
# Not yet verified on a board.
bindto 127.0.0.1
gdb port 3333
tcl port 6666
telnet port disabled
source [find interface/stlink.cfg]
transport select swd
source [find target/stm32f4x.cfg]
adapter speed 1000
target create stm32f4x.ahb mem_ap -dap stm32f4x.dap -ap-num 0 -endian little
stm32f4x.ahb configure -gdb-port disabled
targets stm32f4x.cpu
