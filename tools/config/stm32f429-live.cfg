# STM32F429: Cortex-M4 and direct AHB MEM-AP share AP 0.
# Other chips must provide their own DAP/AP mapping; no AP number is assumed by TUI.
bindto 127.0.0.1
gdb port 3333
tcl port 6666
telnet port disabled
source [find interface/jlink.cfg]
transport select swd
source [find target/stm32f4x.cfg]
adapter speed 1000
target create stm32f4x.ahb mem_ap -dap stm32f4x.dap -ap-num 0 -endian little
stm32f4x.ahb configure -gdb-port disabled
targets stm32f4x.cpu
