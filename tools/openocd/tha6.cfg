# THA6 Gen2 board configuration, adapted from mcal-vsconfig/openocd-debugtui.cfg.
# The caller loads its selected adapter first. No init here: offline validation
# with -c shutdown must not connect to a probe or modify a board.
bindto 127.0.0.1
gdb port 3333
tcl port 6666
telnet port disabled

if {![info exists CHIPNAME]} { set CHIPNAME tha6206 }
set _CHIPNAME [string tolower $CHIPNAME]
switch -- $_CHIPNAME {
    tha6104 { set _cores 1 }
    tha6206 { set _cores 2 }
    tha6412 { set _cores 4 }
    default { error "Unsupported THA chip: $CHIPNAME" }
}
set _available [expr {(1 << $_cores) - 1}]
if {[info exists AVAILABLECORE] && $AVAILABLECORE != $_available} {
    error "AVAILABLECORE does not match $_CHIPNAME physical cores"
}
if {![info exists DEBUGCORE]} { set DEBUGCORE 1 }
if {![info exists EXAMINECORE]} { set EXAMINECORE $DEBUGCORE }
foreach _mask_name {DEBUGCORE EXAMINECORE} {
    set _mask [set $_mask_name]
    if {![string is integer -strict $_mask] || $_mask <= 0 || ($_mask & ~$_available) != 0} {
        error "Invalid $_mask_name mask '$_mask' for $_CHIPNAME"
    }
}
if {($DEBUGCORE & $EXAMINECORE) != $DEBUGCORE} {
    error "EXAMINECORE must include all DEBUGCORE targets"
}
set _debugcore $DEBUGCORE
set _examinecore $EXAMINECORE

# SWD is the reference board default. A custom chip profile can pass
# -c "set THA_TRANSPORT jtag" before loading this file for a JTAG-wired board.
if {![info exists THA_TRANSPORT]} { set THA_TRANSPORT swd }
if {$THA_TRANSPORT ni {swd jtag}} { error "THA_TRANSPORT must be swd or jtag" }
transport select $THA_TRANSPORT
if {![info exists THA_ADAPTER_KHZ]} { set THA_ADAPTER_KHZ 5000 }
adapter speed $THA_ADAPTER_KHZ
source [find target/swj-dp.tcl]
if {[using_jtag]} { set _dpidr 0x6BA00477 } else { set _dpidr 0x6BA02477 }
swj_newdap $_CHIPNAME cpu -irlen 4 -expected-id $_dpidr
dap create $_CHIPNAME.dap -tap $_CHIPNAME.cpu

set DBGBASE {0x80410000 0x80510000 0x80810000 0x80910000}
set CTIBASE {0x80420000 0x80520000 0x80820000 0x80920000}
for {set _core 0} {$_core < $_cores} {incr _core} {
    cti create cti.$_core -dap $_CHIPNAME.dap -ap-num 1 -baseaddr [lindex $CTIBASE $_core]
    target create core.$_core armv8r -dap $_CHIPNAME.dap -ap-num 1 \
        -dbgbase [lindex $DBGBASE $_core] -cti cti.$_core \
        {*}[expr {($_examinecore & (1 << $_core)) != 0 ? "" : "-defer-examine"}]
    if {($_debugcore & (1 << $_core)) != 0} {
        core.$_core configure -gdb-port [expr {3333 + $_core}]
    } else {
        core.$_core configure -gdb-port disabled
    }
}
# Direct bus targets have no GDB listener and do not require CPU execution.
target create APB_1 mem_ap -dap $_CHIPNAME.dap -ap-num 1 -gdb-port disabled
target create AHB_3 mem_ap -dap $_CHIPNAME.dap -ap-num 3 -gdb-port disabled
targets core.0

# Explicit chip-wide reset, based on mcal-vsconfig. These procedures are only
# defined on config load; reset runs when the user invokes dbgreset/chipreset.
set _dbgreset_done 0

proc dbgreset {} {
    global _cores _examinecore _dbgreset_done
    set _dbgreset_done 0
    # MAINRESET.DBGRSTCON.DBGRST: self-clearing debug reset request.
    # A transient bus error can be caused by that reset itself. Do not hide it:
    # report it and require every examined CPU to recover before proceeding.
    if {[catch {AHB_3 mww 0xC00008A0 0x1} _error]} {
        echo "THA debug reset write reported: $_error; checking recovery"
    }
    after 300
    for {set _core 0} {$_core < $_cores} {incr _core} {
        if {($_examinecore & (1 << $_core)) != 0} {
            core.$_core arp_examine
        }
    }
}

proc chipreset {} {
    global _cores _examinecore _dbgreset_done DBGBASE
    set _current [target current]
    set _failed [catch {
        if {!$_dbgreset_done} { dbgreset }
        # EDECR.RCE on core0; EDPRCR.CWRR requests the application reset.
        # This affects the chip, even when DEBUGCORE selects just one CPU.
        APB_1 mww 0x80410024 0x2
        APB_1 mww 0x80410310 0x3
        after 100
        for {set _core 0} {$_core < $_cores} {incr _core} {
            if {($_examinecore & (1 << $_core)) != 0} {
                targets core.$_core
                # Refresh the driver state after reset; do not trust curstate.
                core.$_core arp_poll
                halt 1000
                # EDRCR.CSE is bit2, not bit0. Propagate bus failures.
                APB_1 mww [expr {[lindex $DBGBASE $_core] + 0x090}] 0x4
            }
        }
    } _error]
    # Keep reset catch enabled until halt completes, and clean it up on failure.
    # Restore the caller's selected target on both success and failure.
    if {[catch {APB_1 mww 0x80410024 0x0} _cleanup] && !$_failed} {
        set _failed 1
        set _error $_cleanup
    }
    if {[catch {targets $_current} _cleanup] && !$_failed} {
        set _failed 1
        set _error $_cleanup
    }
    if {$_failed} {
        set _dbgreset_done 0
        return -code error "THA chip reset failed: $_error"
    }
    set _dbgreset_done 1
}
