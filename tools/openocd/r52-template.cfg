# R52 board template. This file intentionally fails until the board mapping is
# supplied. It never guesses a DAP/AP/CTI/debug base, flash algorithm or reset.
# devices/families/cortex-r52.toml sets:
#   CHIPNAME      = selected catalogue ID (e.g. tha6206)
#   DEBUGCORE     = selected core bit mask (e.g. core.1 only -> 2)
#   AVAILABLECORE = all core IDs declared by that chip (tha6206 -> 3)
#
# Replace the error below with the reviewed board configuration. Keep all board
# files beside your custom chip TOML; use relative paths with `source [find ...]` (the
# custom service.cwd should select that directory). Do not add `init` to this file, so
# offline `-f ... -c shutdown` validation remains possible.
#
# Required contract for debug-env.toml:
# 1. The common tools profile loads the selected probes/*.cfg adapter first.
#    Select the board's transport (SWD/JTAG) and set the tested speed here.
# 2. Declare the actual DAP, AP number, debug bases, and CTI instances.
# 3. Expose selected CPU targets named core.0, core.1, ... as `armv8r`.
# 4. Explicitly assign each target GDB port 3333 + physical core ID. Do not
#    renumber core.1 to port 3333 when it is the only selected core.
# 5. Keep unselected CPUs unexamined unless the firmware's startup policy needs
#    them. If helpers must run, implement that reviewed policy explicitly.
# 6. Add board-specific reset/download hooks to the profile/project as needed;
#    do not copy STM32 reset commands or assume an R52+ is the same processor.
# 7. Add memory_access channels only after identifying real MEM-AP targets.
#
# A completed board cfg should also preserve these local-only service settings:
#   bindto 127.0.0.1
#   gdb port 3333
#   tcl port 6666
#   telnet port disabled
#
# For several chips, dispatch here using $CHIPNAME to their own board cfgs.
# The Rust application does not infer any hardware address from that name.
error "R52 board template is not configured: supply an external Chip config and reviewed board cfg based on openocd/r52-template.cfg (adapter, DAP/AP, CTI, core.N targets and fixed GDB ports) before Start."
