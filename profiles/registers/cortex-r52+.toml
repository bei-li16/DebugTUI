[[registers]]
id = "cntpct"
name = "CNTPCT"
group = "timer"
bits = 64
access = "ro"
description = "64-bit physical counter, one genuine MRRC sample; independent reads at different times need not match."
reader = { kind = "cp15_64", cp = 15, op1 = 0, crm = 14 }
access_condition = "Halted physical core; subject to current EL, traps and debug authorization. EL2 read; lower-EL access is controlled by CNTHCTL.PL1PCTEN and, at EL0, CNTKCTL.PL0PCTEN."
[[registers.conditions]]
fact = "timer.present"
min = 1
max = 1
[[registers.fields]]
name = "PhysicalCount"
segments = [{ offset = 0, width = 64 }]
description = "Complete physical count in ticks; one sample, not unrelated low/high MRC reads."
access = "ro"

[[registers]]
id = "cntvct"
name = "CNTVCT"
group = "timer"
bits = 64
access = "ro"
description = "64-bit virtual count (physical count minus CNTVOFF modulo 2^64); belongs to the current core's virtual view."
reader = { kind = "cp15_64", cp = 15, op1 = 1, crm = 14 }
access_condition = "Halted physical core; subject to current EL, traps and debug authorization. EL1/EL2 read; EL0 requires CNTKCTL.PL0VCTEN. CNTVOFF cannot be inferred from differently timed samples."
[[registers.conditions]]
fact = "timer.present"
min = 1
max = 1
[[registers.fields]]
name = "VirtualCount"
segments = [{ offset = 0, width = 64 }]
description = "Complete virtual count in ticks; separate physical and virtual samples are not simultaneous."
access = "ro"

[[registers]]
id = "cntp_cval"
name = "CNTP_CVAL"
group = "timer"
bits = 64
access = "rw"
description = "EL1 physical full 64-bit comparator value, read with one MRRC; viewing does not program or enable the timer."
reader = { kind = "cp15_64", cp = 15, op1 = 2, crm = 14 }
access_condition = "Halted physical core; subject to current EL, traps and debug authorization. EL2: accessible. EL1: CNTHCTL.PL1PCEN controls physical timer access. EL0: also requires CNTKCTL.PL0PTEN; a permission failure does not prove absence."
[[registers.conditions]]
fact = "timer.present"
min = 1
max = 1
[[registers.fields]]
name = "CompareValue"
segments = [{ offset = 0, width = 64 }]
description = "Complete comparator storage; independent read time differs from counter/TVAL samples."

[[registers]]
id = "cntv_cval"
name = "CNTV_CVAL"
group = "timer"
bits = 64
access = "rw"
description = "EL1 virtual full 64-bit comparator value, read with one MRRC; viewing does not program or enable the timer."
reader = { kind = "cp15_64", cp = 15, op1 = 3, crm = 14 }
access_condition = "Halted physical core; subject to current EL, traps and debug authorization. EL1/EL2: virtual timer view. EL0: CNTKCTL.PL0VTEN controls access; a virtual view is not the physical counter or Hyp timer."
[[registers.conditions]]
fact = "timer.present"
min = 1
max = 1
[[registers.fields]]
name = "CompareValue"
segments = [{ offset = 0, width = 64 }]
description = "Complete comparator storage; independent read time differs from counter/TVAL samples."

[[registers]]
id = "cntvoff"
name = "CNTVOFF"
group = "timer"
bits = 64
access = "rw"
description = "64-bit Hyp virtual-counter offset; reading does not change Guest time or counter state."
reader = { kind = "cp15_64", cp = 15, op1 = 4, crm = 14 }
access_condition = "Halted physical core; subject to current EL, traps and debug authorization. EL2/Hyp only; EL1/EL0 cannot use this register."
[[registers.conditions]]
fact = "timer.present"
min = 1
max = 1
[[registers.fields]]
name = "VirtualOffset"
segments = [{ offset = 0, width = 64 }]
description = "Offset subtracted from the physical count modulo 2^64; EL2 owns this value."

[[registers]]
id = "cnthp_cval"
name = "CNTHP_CVAL"
group = "timer"
bits = 64
access = "rw"
description = "Hyp physical full 64-bit comparator value, read with one MRRC; viewing does not program or enable the timer."
reader = { kind = "cp15_64", cp = 15, op1 = 6, crm = 14 }
access_condition = "Halted physical core; subject to current EL, traps and debug authorization. EL2/Hyp only; EL1/EL0 cannot use this register."
[[registers.conditions]]
fact = "timer.present"
min = 1
max = 1
[[registers.fields]]
name = "CompareValue"
segments = [{ offset = 0, width = 64 }]
description = "Complete comparator storage; independent read time differs from counter/TVAL samples."

